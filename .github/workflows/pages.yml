name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p site/apps/designer site/dist/browser
          cp apps/designer/* site/apps/designer/
          cp dist/browser/* site/dist/browser/
          cp site/apps/designer/index.html site/index.html
          sed -i 's#"designer.css"#"apps/designer/designer.css"#; s#"../../dist/browser/thermal-print.js"#"dist/browser/thermal-print.js"#; s#"designer.js"#"apps/designer/designer.js"#' site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
